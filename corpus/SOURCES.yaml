# The doctrine corpus: every manual the experiments run on, identified by
# file name, edition and SHA-256. The PDFs are public but not redistributed
# from this repository; place them under corpus/pdf/ (the file names
# below) and `uv run evaluation prep` checks every hash before it reads a page.
#
# slug        directory under corpus/ and dataset name of the cells
# url         placeholder only (https://ontoops.example.org/<file name>); the manuals
#             are public, obtain them by title and edition and check the SHA-256
# index_run_in  the index prints a heading's first sub-entry on the heading line
# hand_checked  glossary.csv / index.csv / contents.json were checked by hand
#               against the rendered pages; `evaluation prep` never overwrites them
documents:
  - slug: IPB
    file: "ATP_2-01.3 Intelligence_Preparation_of_the_Battlefield.pdf"
    title: "ATP 2-01.3 Intelligence Preparation of the Battlefield"
    edition: "2019-03 (Change 1)"
    sha256: 10a08e6ff0779c7d6c37b4d05f3ab813fcbd86f78d3eefc5348d19e42511827d
    url: "https://ontoops.example.org/ATP_2-01.3_Intelligence_Preparation_of_the_Battlefield.pdf"
    hand_checked: true
