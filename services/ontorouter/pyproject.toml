[project]
name = "ontorouter"
version = "0.1.0"
description = "Lexical routing service: term -> (FalkorDB graph, IRI) pointers"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "psycopg-pool>=3.3.1",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ruff's formatter reformats Python code fences inside Markdown by default;
# docs/ holds reference prose, not source under this project's style gate, so
# it is excluded from the formatter only. A top-level
# extend-exclude would also remove docs/ from the linter, which was never the
# intent. The pattern needs the `/**` suffix: ruff 0.16.5 matches a bare
# `docs/` here against files, not directories, and silently formats them.
[tool.ruff.format]
exclude = ["docs/**"]

# The code style requires explicit hints on every signature, which is what
# disallow_untyped_defs enforces. Full `strict = true` additionally bans the
# Any values that psycopg cursors and FastAPI decorators legitimately produce,
# which would force noise-suppressing ignores rather than better types.
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["falkordb.*", "rapidfuzz.*", "psycopg_pool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Postgres/TEI endpoint (deselected by default)",
]
addopts = "-m 'not integration'"
