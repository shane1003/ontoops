[project]
name = "ontoagent"
version = "0.1.0"
description = "OntoOps ontoagent: CQ conceptualizer, TBox builder and ABox loader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM (local OpenAI-compatible server)
    "openai>=1.40",
    # LLM observability (optional): traces only when the LANGFUSE_* env vars are set, else no-op
    "langfuse>=2.53,<3.0",
    # Data validation / settings / utilities
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Retry transient LLM errors (429/5xx)
    "tenacity>=8",
    # CLI
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # --- tboxcraft module ---
    # TBox authoring/serialization + HermiT reasoning (needs a JVM)
    "owlready2>=0.48",
    "rdflib>=7.0",
    # Local LLM/TEI/OOPS HTTP calls (all imported lazily)
    "requests>=2.31",
    # Vector math + Postgres (pgvector)
    "numpy>=1.26",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # NOTE: httpx was declared but unused in tboxcraft, so it is not carried over.
    # --- aboxmapper module ---
    # Client of the graph store the TBox graph is built in
    "falkordb>=1.0",
    # Multipart file upload for POST /abox/load/upload
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# In-process e5 embeddings (pulls in torch: heavy). Production uses TEI (remote_e5), so
# not installed by default.
local = [
    "sentence-transformers>=3.0",
]

[project.scripts]
conceptualizer = "app.conceptualizer.cli:app"
tboxcraft = "app.tboxcraft.cli:main"
aboxmapper = "app.aboxmapper.cli.load:main"
aboxmapper-graph = "app.aboxmapper.cli.graph:main"
aboxmapper-migrate = "app.aboxmapper.cli.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # FastAPI TestClient backend; declared explicitly rather than relying on a transitive
    # dependency of the openai SDK.
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real providers/reasoner/network; skipped by default",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
